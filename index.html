<!DOCTYPE html>

<title>LCA · 年份进度</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  background:

  color:#F8F0EE;
  font-family:'Space Grotesk','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;

.wrap{text-align:center;width:min(760px,88vw)}
h1{

  letter-spacing:-.02em;
  margin-bottom:clamp(28px,6vh,56px);

h1 span{color:#D08C8B}
.links{display:flex;flex-direction:column;gap:18px;align-items:center}
a{
  display:block;
  width:min(420px,100%);
  padding:20px 28px;
  border:1px solid rgba(208,140,139,.45);
  border-radius:14px;
  color:#D08C8B;
  text-decoration:none;
  font-size:clamp(16px,3.4vw,20px);
  font-weight:500;
  letter-spacing:.05em;
  transition:background .3s ease;
}
a:hover{background:rgba(208,140,139,.14)}
a small{
  display:block;
  margin-top:6px;
  font-size:12px;
  color:rgba(208,140,139,.6);

}
</style>
