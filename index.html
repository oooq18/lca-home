@property --fill {
  syntax: '<percentage>';
  inherits: true;
  initial-value: 0%;

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --wine:#520E0F;
  --pink:#D08C8B;
  --white:#FFFFFF;
  --ysize:clamp(46px,10.5vw,150px);
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(90% 60% at 50% 35%, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 60%),
    var(--wine);
  font-family:'DIN 1451 LT W06 Mittelschrift',system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}

.wrap{width:min(800px,92vw);text-align:center}

/* ===== 年份区：两端对齐，三槽轮转 ===== */
.years{position:relative;width:100%;height:var(--ysize)}
.y-slot{
  position:absolute;top:0;left:0;
  font-size:var(--ysize);
  font-weight:500;
  line-height:1;
  letter-spacing:-.01em;
  white-space:nowrap;
  background:linear-gradient(90deg,var(--white) 0%,var(--white) var(--fill),var(--pink) var(--fill));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  opacity:0;
  transition:transform .9s cubic-bezier(.22,1,.36,1), opacity .5s ease, --fill 1.2s cubic-bezier(.22,1,.36,1);
  will-change:transform;
}
body.boot .y-slot{transition:none}

/* ===== 月份：两端对齐年份两边 ===== */
.months{
  display:flex;
  justify-content:space-between;
  width:100%;
  margin-top:clamp(40px,9vh,84px);
  font-size:clamp(16px,3.2vw,28px);
  font-weight:500;
}
.months span{
  background:linear-gradient(90deg,var(--white) 0%,var(--white) var(--fill),var(--pink) var(--fill));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  transition:--fill 1.2s cubic-bezier(.22,1,.36,1);
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

<body class="boot">
<div class="wrap">
  <div class="years" id="years">
    <div class="y-slot" id="e1">2026</div>
    <div class="y-slot" id="e2">2027</div>
    <div class="y-slot" id="e3">2028</div>
  </div>
  <div class="months" id="months"></div>
</div>

<script>
const now = new Date();
let y = now.getFullYear();
let busy = false;

const yearsEl = document.getElementById('years');
const monthsEl = document.getElementById('months');

const s1 = { el: document.getElementById('e1'), pos: 'LEFT' };
const s2 = { el: document.getElementById('e2'), pos: 'RIGHT' };
const s3 = { el: document.getElementById('e3'), pos: 'OUT_R' };
const slots = [s1, s2, s3];

function measureOffsetR(){
  return yearsEl.offsetWidth - s2.el.offsetWidth;
}
function transformOf(pos, offR){
  if (pos === 'LEFT')  return 'translateX(0)';
  if (pos === 'RIGHT') return 'translateX(' + offR + 'px)';
  if (pos === 'OUT_R') return 'translateX(130vw)';
  return 'translateX(-130vw)'; // OUT_L
}
function applyPos(s, offR){
  s.el.style.transform = transformOf(s.pos, offR);
  s.el.style.opacity = (s.pos === 'LEFT' || s.pos === 'RIGHT') ? 1 : 0;
}

/* 按当前时间刷新年份进度与月份 */
function refreshAll(){
  const base = new Date();
  const yy = base.getFullYear();
  document.title = yy + ' / ' + (yy + 1);

  /* 今年槽的年度进度填充 */
  const left = slots.find(s => s.pos === 'LEFT');
  const pct = ((base - new Date(yy,0,1)) / (new Date(yy+1,0,1) - new Date(yy,0,1))) * 100;
  left.el.style.setProperty('--fill', pct.toFixed(2) + '%');
  for (const s of slots) {
    if (s !== left) s.el.style.setProperty('--fill', '0%');
  }

  /* 月份：按新基准重算，串行扫过 */
  const dayOfYear = Math.floor((base - new Date(yy,0,1)) / 86400000) + 1;
  monthsEl.innerHTML = '';
  const STEP = 340;
  let cum = 0;
  for (let i = 1; i <= 12; i++) {
    const dim = new Date(yy, i, 0).getDate();
    const dayStart = cum + 1;
    cum += dim;
    const f = Math.min(1, Math.max(0, (dayOfYear - dayStart + 1) / dim));
    const sp = document.createElement('span');
    sp.textContent = i;
    sp.dataset.fill = (f * 100).toFixed(2);
    sp.style.transitionDuration = STEP + 'ms';
    sp.style.transitionDelay = ((i - 1) * STEP) + 'ms';
    monthsEl.appendChild(sp);
  }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    for (const sp of monthsEl.children) {
      sp.style.setProperty('--fill', sp.dataset.fill + '%');
    }
  }));
}

/* 跨年轮转：今年出左、明年左移、后年入右 */
function rotate(){
  if (busy) return;
  busy = true;
  const offR = measureOffsetR();

  const next = { LEFT:'OUT_L', RIGHT:'LEFT', OUT_R:'RIGHT' };
  for (const s of slots) {
    if (next[s.pos]) {
      s.pos = next[s.pos];
      applyPos(s, offR);
    }
  }

  setTimeout(() => {
    const s = slots.find(x => x.pos === 'OUT_L');
    s.el.style.transition = 'none';
    s.el.textContent = y + 3;              // 新后年
    s.el.style.setProperty('--fill', '0%');
    s.pos = 'OUT_R';
    s.el.style.transform = transformOf('OUT_R', measureOffsetR());
    s.el.style.opacity = 0;
    void s.el.offsetWidth;
    s.el.style.transition = '';
    y += 1;
    refreshAll();
    busy = false;
  }, 1000);
}

/* 初始就位 */
s1.el.textContent = y;
s2.el.textContent = y + 1;
s3.el.textContent = y + 2;
const offInit = measureOffsetR();
for (const s of slots) applyPos(s, offInit);
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.body.classList.remove('boot');
}));
refreshAll();

/* 屏幕旋转 / 窗口尺寸变化时重新测量并定位年份（无动画校正） */
function reposition(){
  const offR = measureOffsetR();
  for (const s of slots) {
    s.el.style.transition = 'none';
    applyPos(s, offR);
    void s.el.offsetWidth;
    s.el.style.transition = '';
  }
}
window.addEventListener('resize', () => requestAnimationFrame(() => requestAnimationFrame(reposition)));
window.addEventListener('orientationchange', () => requestAnimationFrame(() => requestAnimationFrame(reposition)));

/* 字体异步加载完成后重新定位，避免按 fallback 字体宽度测量导致错位 */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(reposition)));
}

/* 真实跨年自动轮转：检测到年份变化即播放动画 */
setInterval(() => {
  if (busy) return;
  const ny = new Date().getFullYear();
  if (ny !== y) rotate();
}, 1000);
</script>
</body>
