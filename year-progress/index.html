<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年度进度</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
@property --fill {
  syntax: '<percentage>';
  inherits: true;
  initial-value: 0%;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:#05060f;
  color:#e6e9f5;
  font-family:'Space Grotesk','Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58% 42% at 50% 36%, rgba(77,124,255,.16) 0%, rgba(77,124,255,0) 100%),
    radial-gradient(46% 34% at 50% 102%, rgba(168,85,247,.10) 0%, rgba(168,85,247,0) 100%);
}
.stage{
  position:relative;z-index:1;
  width:min(88vw,760px);
  text-align:center;
  opacity:0;
  transition:opacity .8s ease .15s;
}
.stage.ready{opacity:1}

/* 顶部日期 */
.date{
  color:#6b7598;
  font-size:clamp(12px,3.4vw,14px);
  letter-spacing:.06em;
  font-weight:500;
  margin-bottom:4.5vh;
}

/* 年份数字行 */
.years{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:clamp(16px,6vw,60px);
}
.year-num{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,14px)}
.this-year{
  font-size:clamp(88px,20vw,230px);
  font-weight:700;
  line-height:.9;
  letter-spacing:-.04em;
  background:linear-gradient(90deg,#4d7cff 0%,#a855f7 var(--fill),#242e4a var(--fill));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  transition:--fill 1.6s cubic-bezier(.22,1,.36,1);
}
.next-year{
  font-size:clamp(42px,9.5vw,104px);
  font-weight:700;
  line-height:.9;
  letter-spacing:-.02em;
  color:#242e4a;
}
.year-tag{
  font-size:clamp(11px,3vw,13px);
  color:#5b6486;
  letter-spacing:.35em;
  font-weight:500;
}

/* 进度条 */
.track-zone{margin-top:clamp(36px,7vh,60px)}
.track{
  position:relative;
  height:10px;
  border-radius:99px;
  background:rgba(255,255,255,.07);
}
.fill{
  position:absolute;left:0;top:0;bottom:0;
  width:var(--fill);
  border-radius:99px;
  background:linear-gradient(90deg,#4d7cff,#a855f7);
  transition:width 1.6s cubic-bezier(.22,1,.36,1);
}
.marker{
  position:absolute;
  top:50%;
  left:clamp(34px,var(--fill),calc(100% - 34px));
  transform:translate(-50%,-50%);
  width:20px;height:20px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 4px rgba(168,85,247,.25),0 0 18px rgba(168,85,247,.65);
  transition:left 1.6s cubic-bezier(.22,1,.36,1);
  z-index:2;
}
.pct{
  position:absolute;
  top:-38px;
  left:clamp(34px,var(--fill),calc(100% - 34px));
  transform:translateX(-50%);
  font-size:clamp(12px,3.4vw,15px);
  font-weight:700;
  color:#c7d2ff;
  white-space:nowrap;
  transition:left 1.6s cubic-bezier(.22,1,.36,1);
}
.track-caps{
  display:flex;justify-content:space-between;
  margin-top:12px;
  color:#5b6486;
  font-size:clamp(11px,3vw,13px);
  font-weight:500;
}

/* 底部统计 */
.stats{
  display:flex;justify-content:space-between;
  margin-top:clamp(26px,5vh,44px);
  padding-top:clamp(16px,3vh,24px);
  border-top:1px solid rgba(255,255,255,.06);
  color:#8a94b8;
  font-size:clamp(12px,3.4vw,14px);
  font-weight:500;
}
.stats b{color:#e6e9f5;font-weight:700}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="date" id="date"></div>

  <div class="years">
    <div class="year-num">
      <span class="this-year" id="thisYear">2026</span>
      <span class="year-tag">今年</span>
    </div>
    <div class="year-num">
      <span class="next-year" id="nextYear">2027</span>
      <span class="year-tag">明年</span>
    </div>
  </div>

  <div class="track-zone">
    <div class="track">
      <div class="fill"></div>
      <div class="pct" id="pct">0%</div>
      <div class="marker"></div>
    </div>
    <div class="track-caps">
      <span>1月1日</span>
      <span>12月31日</span>
    </div>
  </div>

  <div class="stats">
    <span>今年第 <b id="dayOfYear">–</b> 天</span>
    <span>还剩 <b id="daysLeft">–</b> 天</span>
  </div>
</div>

<script>
const now = new Date();
const year = now.getFullYear();
const start = new Date(year, 0, 1);
const end = new Date(year + 1, 0, 1);

const totalMs = end - start;
const elapsed = now - start;
const pct = (elapsed / totalMs) * 100;
const dayOfYear = Math.floor(elapsed / 86400000) + 1;
const daysLeft = Math.ceil((end - now) / 86400000);

document.title = year + ' 年度进度';
document.getElementById('thisYear').textContent = year;
document.getElementById('nextYear').textContent = year + 1;
document.getElementById('date').textContent =
  now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' +
  ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
document.getElementById('dayOfYear').textContent = dayOfYear;
document.getElementById('daysLeft').textContent = daysLeft;
document.getElementById('pct').textContent = pct.toFixed(1) + '%';

// 入场：从 0 平滑生长到当前进度
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.documentElement.style.setProperty('--fill', pct.toFixed(2) + '%');
  document.getElementById('stage').classList.add('ready');
}));
</script>
</body>
</html>
